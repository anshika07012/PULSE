<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Patient checking their queue token on a phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f8ee"/><stop offset="1" stop-color="#bfe3cf"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- monitor -->
  <g transform="translate(70 90)">
    <rect width="230" height="150" rx="14" fill="#17302a"/>
    <path d="M14 82h50l14-30 22 62 20-80 16 48h80" fill="none" stroke="#5ee0a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="36" font-family="Manrope,Arial" font-size="26" font-weight="800" fill="#5ee0a0">72</text>
    <rect x="95" y="150" width="40" height="30" fill="#2c4a42"/><rect x="60" y="178" width="110" height="10" rx="5" fill="#2c4a42"/>
  </g>
  <!-- plant -->
  <g transform="translate(660 330)"><rect x="-26" y="90" width="52" height="60" rx="8" fill="#287a51"/><path d="M0 90C-30 40-20 0 0-30c20 30 30 70 0 120zM0 90C30 50 60 40 66 10 30 20 8 50 0 90zM0 90C-30 60-60 60-70 30-30 36-6 60 0 90z" fill="#3d9b6a"/></g>
  <rect y="500" width="800" height="100" fill="#a9d6bf"/>
  <!-- patient -->
  <path d="M215 600C215 480 290 425 400 425s185 55 185 175z" fill="#4a7ab8"/>
  <path d="M340 428q60 30 120 0l-8 30q-52 24-104 0z" fill="#3b659a"/>
  <rect x="381" y="372" width="38" height="60" rx="16" fill="#c68a66"/>
  <ellipse cx="400" cy="318" rx="52" ry="62" fill="#d99a73"/>
  <path d="M346 312c-10-76 108-76 108 0-8-30-20-44-54-44s-46 14-54 44z" fill="#1f1a18"/>
  <circle cx="379" cy="322" r="5" fill="#1f1a18"/><circle cx="421" cy="322" r="5" fill="#1f1a18"/>
  <path d="M382 352q18 15 36 0" stroke="#8a4e3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- phone with token -->
  <g transform="translate(455 440) rotate(-12)">
    <rect width="120" height="200" rx="18" fill="#101a16"/>
    <rect x="7" y="9" width="106" height="182" rx="12" fill="#ffffff"/>
    <rect x="18" y="24" width="84" height="12" rx="6" fill="#e1ede6"/>
    <text x="60" y="88" text-anchor="middle" font-family="Manrope,Arial" font-size="38" font-weight="800" fill="#171917">#43</text>
    <text x="60" y="108" text-anchor="middle" font-family="DM Sans,Arial" font-size="11" fill="#6d716e">Your token</text>
    <rect x="22" y="126" width="76" height="9" rx="4.5" fill="#e1ede6"/><rect x="22" y="126" width="48" height="9" rx="4.5" fill="#287a51"/>
    <text x="60" y="158" text-anchor="middle" font-family="DM Sans,Arial" font-size="11" font-weight="700" fill="#287a51">About 6 min</text>
  </g>
  <path d="M470 505c-18 12-24 28-12 36" stroke="#d99a73" stroke-width="22" stroke-linecap="round" fill="none"/>
</svg>
